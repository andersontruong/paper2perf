[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2perf"
version = "0.2.6"
description = "Document-grounded hardware performance investigations with LangGraph"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3", "pymupdf>=1.24.3,<2",
  "networkx>=3.4,<4", "numpy>=1.26,<3", "scipy>=1.14,<2", "sympy>=1.13,<2",
  "pydot>=3,<5", "pysmt>=0.9.6,<1", "z3-solver>=4.13,<5", "torch==2.10.0",
  "plotly>=5.24,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
paper2perf = "paper2perf.cli:main"

[tool.setuptools.packages.find]
where = ["src", "vendor/hw-perf/mapper/src", "vendor/hw-perf/hardware_model/src", "vendor/hw-perf/software_model/parabolic/src"]

[tool.setuptools.package-data]
paper2perf = ["prompts/*.txt", "vendor_manifest.json"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
