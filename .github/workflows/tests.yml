name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - name: Require real A100 capture, mapping, and scheduling
        run: python scripts/verify_a100.py
      - name: Require actual graph and simulator dependencies
        run: python -c "import langgraph, torch, networkx, pysmt, z3, parabolic, hw_model, dataflow_mapper"
